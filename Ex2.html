<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Survey Form</title>
  <!-- Bootstrap CSS (Bonus part) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

  <div class="container border rounded p-4" style="max-width: 600px;">
    <div class="text-center mb-3">
      <img src="logo.png" alt="Logo" width="100">
      <h3>Survey</h3>
      <p>If you have a moment, we’d appreciate it if you would fill out this survey.</p>
    </div>

    <form action="result.html" method="POST">
      <h5>Your information:</h5>

      <!-- Text Fields -->
      <div class="mb-3">
        <label for="fname" class="form-label">First Name</label>
        <input type="text" class="form-control" id="fname" name="fname" required>
      </div>

      <div class="mb-3">
        <label for="lname" class="form-label">Last Name</label>
        <input type="text" class="form-control" id="lname" name="lname" required>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" required>
      </div>

      <div class="mb-3">
        <label for="dob" class="form-label">Date of Birth</label>
        <input type="date" class="form-control" id="dob" name="dob" required>
      </div>

      <!-- Radio Buttons -->
      <div class="mb-3">
        <h5>How did you hear about us?</h5>
        <div>
          <input type="radio" id="search" name="source" value="Search Engine" required>
          <label for="search">Search engine</label>
        </div>
        <div>
          <input type="radio" id="word" name="source" value="Word of mouth">
          <label for="word">Word of mouth</label>
        </div>
        <div>
          <input type="radio" id="social" name="source" value="Social Media">
          <label for="social">Social Media</label>
        </div>
        <div>
          <input type="radio" id="other" name="source" value="Other">
          <label for="other">Other</label>
        </div>
      </div>

      <!-- Checkboxes -->
      <div class="mb-3">
        <h5>Would you like to receive announcements about new CDs and special offers?</h5>
        <div>
          <input type="checkbox" id="cd" name="announcement" value="Yes">
          <label for="cd">YES, I’d like that.</label>
        </div>
        <div>
          <input type="checkbox" id="emailnews" name="emailnews" value="Email announcements">
          <label for="emailnews">YES, please send me email announcements.</label>
        </div>
      </div>

      <!-- Combo Box -->
      <div class="mb-3">
        <label for="contact" class="form-label">Please contact me by:</label>
        <select id="contact" name="contact" class="form-select">
          <option value="Email or postal mail">Email or postal mail</option>
          <option value="Email only">Email only</option>
          <option value="Postal mail only">Postal mail only</option>
        </select>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
  </div>

</body>
</html>
