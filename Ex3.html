<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 3 - Flexbox Layout</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding:40px 0;
      background-color: burlywood;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      width: 800px;
      background-color: #fff;
      border: 2px solid #e0a65c;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    .header, .footer {
      background-color: #fff;
      text-align: center;
      font-weight: bold;
      padding: 10px;
      border-bottom: 1px solid #e0a65c;
    }

    .footer {
      border-top: 1px solid #e0a65c;
      border-bottom: none;
    }

    .content {
      display: flex;
      border-top: 1px solid #e0a65c;
      border-bottom: 1px solid #e0a65c;
      flex: 1;
      height: 400px;
    }

    .sidebar {
      width: 200px;
      border-right: 1px solid #e0a65c;
      padding: 10px;
      box-sizing: border-box;
      height: 400px;
    }

    .main {
      flex: 1;
      padding: 10px;
      box-sizing: border-box;
    }
    .footer {
      background-color: rgb(247, 247, 249);
    }
    .sidebar:last-child {
  border-right: none;        
  border-left: 1px solid #e0a65c; 
}
  </style>
</head>
<body>
  <div class="container">
    <header class="header">Header</header>

    <div class="content">
      <div class="sidebar">Sidebar A</div>
      <div class="main">Main Content</div>
      <div class="sidebar">Sidebar B</div>
    </div>

    <footer class="footer">Footer</footer>
  </div>
</body>
</html>
